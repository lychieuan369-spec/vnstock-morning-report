name: VN Stock Afternoon Report

on:
  # schedule trigger moved to Railway Cron (GitHub Actions schedule had 2.5-4.7h queue delay)
  workflow_dispatch:

jobs:
  afternoon-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install vnstock>=3.0.0 pandas>=2.0.0 requests>=2.31.0
      - name: Run afternoon report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python afternoon_report.py
