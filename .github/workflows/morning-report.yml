name: VN Stock Morning Report

on:
  schedule:
    - cron: '30 1 * * 1-5'  # 8:30 ICT (UTC+7), T2-T6
  workflow_dispatch:

jobs:
  morning-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install vnstock>=3.0.0 yfinance>=0.2.0 pandas>=2.0.0 numpy>=1.24.0 requests>=2.31.0

      - name: Run morning report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python morning_report.py
